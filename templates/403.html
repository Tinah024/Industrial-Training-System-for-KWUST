<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Access Denied — KWUST</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Inter',sans-serif;background:#F4F8F7;display:flex;align-items:center;justify-content:center;min-height:100vh;}
        .box{text-align:center;padding:60px 40px;}
        .code{font-size:80px;font-weight:800;color:#0A2E2F;letter-spacing:-.04em;}
        .code span{color:#157A73;}
        h1{font-size:22px;font-weight:700;color:#0A2E2F;margin:12px 0 8px;}
        p{font-size:15px;color:#5B7674;margin-bottom:28px;}
        a{display:inline-block;background:#157A73;color:#fff;padding:12px 28px;border-radius:9px;text-decoration:none;font-weight:600;font-size:14px;}
        a:hover{background:#1A8F87;}
    </style>
</head>
<body>
    <div class="box">
        <div class="code">4<span>0</span>3</div>
        <h1>Access Denied</h1>
        <p>You don't have permission to view this page.</p>
        <a href="/">Go back home</a>
    </div>
</body>
</html>
