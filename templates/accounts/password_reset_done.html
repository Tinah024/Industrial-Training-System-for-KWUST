<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Your Email - Industrial Training System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        *{box-sizing:border-box;margin:0;padding:0;}
        body{font-family:'Inter',sans-serif;background:#F4F8F7;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
        @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
        .rcard{background:#fff;width:100%;max-width:400px;border-radius:16px;padding:40px 36px;box-shadow:0 20px 60px rgba(10,46,47,.12);text-align:center;animation:fadeUp .4s ease both;}
        .r-icon{width:56px;height:56px;border-radius:14px;background:#E5F4F2;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;}
        .r-icon i{font-size:26px;color:#157A73;}
        .rcard h1{font-size:19px;font-weight:700;color:#0A2E2F;margin-bottom:8px;}
        .rcard p{font-size:13px;color:#7A9290;line-height:1.6;margin-bottom:22px;}
        .switch{text-align:center;margin-top:4px;font-size:12.5px;color:#7A9290;}
        .switch a{color:#157A73;font-weight:600;text-decoration:none;}
        .switch a:hover{text-decoration:underline;}
    </style>
</head>
<body>
    <div class="rcard">
        <div class="r-icon"><i class="ti ti-mail-check" aria-hidden="true"></i></div>
        <h1>Check your email</h1>
        <p>If an account exists for that email, we've sent a link to reset your password. The link expires soon, so use it right away.</p>
        <p class="switch"><a href="{% url 'login' %}">← Back to login</a></p>
    </div>
</body>
</html>
