<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset Complete - Industrial Training System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        *{box-sizing:border-box;margin:0;padding:0;}
        body{font-family:'Inter',sans-serif;background:#F4F8F7;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
        @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
        .rcard{background:#fff;width:100%;max-width:400px;border-radius:16px;padding:40px 36px;box-shadow:0 20px 60px rgba(10,46,47,.12);text-align:center;animation:fadeUp .4s ease both;}
        .r-icon{width:56px;height:56px;border-radius:14px;background:#DCFCE7;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;}
        .r-icon i{font-size:26px;color:#166534;}
        .rcard h1{font-size:19px;font-weight:700;color:#0A2E2F;margin-bottom:8px;}
        .rcard p{font-size:13px;color:#7A9290;line-height:1.6;margin-bottom:22px;}
        .btn-primary{display:inline-flex;align-items:center;justify-content:center;width:100%;padding:12px;background:#157A73;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;text-decoration:none;}
        .btn-primary:hover{background:#1A8F87;}
    </style>
</head>
<body>
    <div class="rcard">
        <div class="r-icon"><i class="ti ti-circle-check" aria-hidden="true"></i></div>
        <h1>Password reset complete</h1>
        <p>Your password has been changed successfully. You can now log in with your new password.</p>
        <a href="{% url 'login' %}" class="btn-primary">Back to login</a>
    </div>
</body>
</html>
